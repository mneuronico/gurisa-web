<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gurisa y Rio - entre mates y aventuras</title>
    <meta
      name="description"
      content="Gurisa y Rio: episodios, guias para el aula y enlaces de aventuras."
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="site" aria-labelledby="page-title">
      <h1 id="page-title" class="visually-hidden">
        Gurisa y Rio entre mates y aventuras
      </h1>

      <div class="artboard" aria-label="Gurisa y Rio entre mates y aventuras">
        <div class="scene">
          <img
            class="layer fondo"
            src="partes/fondo000.png"
            alt=""
            aria-hidden="true"
            draggable="false"
          >
          <img class="layer gradients" src="partes/gradients000.png" alt="" aria-hidden="true" draggable="false">

        <img class="layer titulo float-soft" src="partes/Titulo_gurisa_y_rio.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer girl-standing float-soft delay-1" src="partes/Girl_standing.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer boy-standing float-soft delay-2" src="partes/Boy_standing.png" alt="" aria-hidden="true" draggable="false">

        <img class="layer volti float-soft delay-2" src="partes/Volti_y_amperin_and_animal.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer modo float-soft delay-3" src="partes/Modo_carpincho_and_animal.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer jujo float-soft delay-1" src="partes/jujo_aparece_and_man.png" alt="" aria-hidden="true" draggable="false">

        <img class="layer episodios-title title-drift" src="partes/Episodios.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer capitulo-1-img pop-hover" src="partes/Capitulo1.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer capitulo-2-img pop-hover" src="partes/Capitulo2.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer capitulo-3-img pop-hover" src="partes/Capitulo3.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer capitulo-4-img pop-hover" src="partes/Capitulo4.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer capitulo-5-img pop-hover" src="partes/Capitulo5.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer capybara-bike float-soft delay-3" src="partes/Capybara_on_bike.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer animal-pointing float-soft delay-1" src="partes/Animal_pointing_up.png" alt="" aria-hidden="true" draggable="false">

        <img class="layer estrellitas sparkle" src="partes/estrellitas.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer guias-title title-drift delay-2" src="partes/Guias_para_el_aula.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer girl-jumping float-soft delay-1" src="partes/Girl_jumping.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer boy-jumping float-soft delay-2" src="partes/Boy_jumping.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer guia-1-img paper-wiggle" src="partes/Guia1.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer guia-2-img paper-wiggle delay-1" src="partes/Guia2.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer guia-3-img paper-wiggle delay-2" src="partes/Guia3.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer guia-4-img paper-wiggle delay-3" src="partes/Guia4.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer guia-5-img paper-wiggle delay-1" src="partes/Guia5.png" alt="" aria-hidden="true" draggable="false">

        <img class="layer queres-img pulse-soft" src="partes/Queres_conocer.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer enersa-img float-soft delay-2" src="partes/Enersa_sign_and_animal_sitting.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer turismo-img float-soft delay-3" src="partes/Turismo_sign_and_animal_standing.png" alt="" aria-hidden="true" draggable="false">
        <img class="layer mientrerios-img float-soft delay-1" src="partes/mientrerios_sign_and_man_standing.png" alt="" aria-hidden="true" draggable="false">

        <a class="hotspot volti-button" href="#" data-target="volti" aria-label="Abrir Volti y Amperin"></a>
        <a class="hotspot modo-button" href="#" data-target="modo" aria-label="Abrir Modo Carpincho"></a>
        <a class="hotspot jujo-button" href="#" data-target="jujo" aria-label="Abrir Jujo aparece"></a>

        <a class="hotspot capitulo-1" href="#" data-target="capitulo-1-img" aria-label="Ver capitulo 1"></a>
        <a class="hotspot capitulo-2" href="#" data-target="capitulo-2-img" aria-label="Ver capitulo 2"></a>
        <a class="hotspot capitulo-3" href="#" data-target="capitulo-3-img" aria-label="Ver capitulo 3"></a>
        <a class="hotspot capitulo-4" href="#" data-target="capitulo-4-img" aria-label="Ver capitulo 4"></a>
        <a class="hotspot capitulo-5" href="#" data-target="capitulo-5-img" aria-label="Ver capitulo 5"></a>

        <a class="hotspot guia-1" href="#" data-target="guia-1-img" aria-label="Abrir guia 1"></a>
        <a class="hotspot guia-2" href="#" data-target="guia-2-img" aria-label="Abrir guia 2"></a>
        <a class="hotspot guia-3" href="#" data-target="guia-3-img" aria-label="Abrir guia 3"></a>
        <a class="hotspot guia-4" href="#" data-target="guia-4-img" aria-label="Abrir guia 4"></a>
        <a class="hotspot guia-5" href="#" data-target="guia-5-img" aria-label="Abrir guia 5"></a>

        <a
          class="hotspot queres-conocer"
          href="#"
          data-target="queres-img"
          aria-label="Conocer mas aventuras de Gurisa y Rio"
        ></a>
        <a class="hotspot enersa" href="#" data-target="enersa-img" aria-label="Abrir Enersa"></a>
          <a class="hotspot turismo" href="#" data-target="turismo-img" aria-label="Abrir Turismo"></a>
          <a class="hotspot mientrerios" href="#" data-target="mientrerios-img" aria-label="Abrir Mientrerios"></a>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
